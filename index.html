<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callzy - Links</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* --- EFEK PETIR BACKGROUND --- */
        .lightning-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .lightning {
            position: absolute;
            width: 2px;
            height: 100vh;
            background: linear-gradient(to bottom, transparent, #60a5fa, #ffffff, #60a5fa, transparent);
            opacity: 0;
            filter: blur(1px);
            box-shadow: 0 0 20px #60a5fa, 0 0 40px #3b82f6;
        }

        .lightning-1 { left: 15%; animation: strike1 8s infinite; }
        .lightning-2 { right: 20%; animation: strike2 12s infinite; animation-delay: 3s; }
        .lightning-3 { left: 50%; animation: strike1 15s infinite; animation-delay: 7s; }

        @keyframes strike1 {
            0%, 90%, 100% { opacity: 0; transform: scaleY(0); transform-origin: top; }
            92% { opacity: 1; transform: scaleY(1); transform-origin: top; }
            94% { opacity: 0; transform: scaleY(1); transform-origin: top; }
            96% { opacity: 1; transform: scaleY(1); transform-origin: bottom; }
            98% { opacity: 0; transform: scaleY(1); transform-origin: bottom; }
        }

        @keyframes strike2 {
            0%, 85%, 100% { opacity: 0; transform: scaleY(0); transform-origin: top; }
            87% { opacity: 1; transform: scaleY(1); transform-origin: top; }
            89% { opacity: 0; transform: scaleY(1); transform-origin: top; }
            91% { opacity: 1; transform: scaleY(1); transform-origin: bottom; }
            93% { opacity: 0; transform: scaleY(1); transform-origin: bottom; }
        }

        .glow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Container Utama */
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        .profile-section {
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            padding: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            transition: transform 0.3s ease;
        }

        .profile-img:hover { transform: scale(1.05); }

        .profile-img img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0f172a;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .section-title {
            color: rgba(148, 163, 184, 0.8);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            text-align: left;
            padding-left: 5px;
            font-weight: 600;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .link-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 18px;
            border-radius: 14px;
            text-decoration: none;
            color: #f1f5f9;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .link-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
            border-color: rgba(96, 165, 250, 0.5);
        }

        .link-item:hover::after { transform: translateX(100%); }
        .link-item:active { transform: translateY(-1px); }

        .link-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .link-item:hover .link-icon { transform: scale(1.1); }

        .icon-payment { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .icon-wa { background: linear-gradient(135deg, #25d366, #128c7e); }
        .icon-channel { background: linear-gradient(135deg, #0ea5e9, #0284c7); }

        .link-icon svg { width: 20px; height: 20px; fill: white; }

        .link-text { flex-grow: 1; text-align: left; }

        .link-arrow {
            color: #64748b;
            font-size: 18px;
            transition: color 0.3s;
        }

        .link-item:hover .link-arrow { color: #60a5fa; }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            margin: 25px 0;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 350px;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 20px;
        }

        .modal-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            color: white;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            gap: 10px;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(0,0,0,0.5);
            opacity: 0.95;
        }

        .btn-dana { background: linear-gradient(135deg, #118eea, #005bb5); box-shadow: 0 4px 15px rgba(17, 142, 234, 0.3); }
        .btn-qris { background: linear-gradient(135deg, #e11d48, #be123c); box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3); }
        .btn-copy { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }

        .modal-btn svg { width: 20px; height: 20px; fill: currentColor; }

        .modal-close {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 10px;
            transition: all 0.3s;
            width: 100%;
        }

        .modal-close:hover { background: rgba(255, 255, 255, 0.1); color: #f1f5f9; }

        .dana-detail {
            background: rgba(17, 142, 234, 0.1);
            border: 1px dashed rgba(17, 142, 234, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
        }

        .dana-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .dana-number {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .dana-name { font-size: 14px; color: #cbd5e1; font-weight: 500; }

        /* Toast */
        .toast {
            visibility: hidden;
            min-width: 250px;
            background: rgba(16, 185, 129, 0.9);
            backdrop-filter: blur(10px);
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 15px 20px;
            position: fixed;
            z-index: 2000;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- EFEK PETIR -->
    <div class="lightning-container">
        <div class="lightning lightning-1"></div>
        <div class="lightning lightning-2"></div>
        <div class="lightning lightning-3"></div>
    </div>
    <div class="glow-bg"></div>

    <div class="container">
        <!-- Profil -->
        <div class="profile-section">
            <div class="profile-img">
                <!-- ⬇️ GANTI LINK FOTO PROFIL ANDA DI SINI ⬇️ -->
                <img src="https://cdn.phototourl.com/member/2026-10-10-1d3bbfaa-41e7-43be-972d-69f5208cf978.jpg" alt="Callzy">

                </div>
                <div class="link-text">Pilih Metode Pembayaran</div>
                <div class="link-arrow">›</div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Kontak -->
        <div class="section-title">Hubungi & Ikuti</div>
        <div class="link-list">
            <a href="https://wa.me/6285895196739" target="_blank" class="link-item">
                <div class="link-icon icon-wa">
                    <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.17-3.12.82.83-3.04-.2-.32a8.188 8.188 0 0 1-1.26-4.38c.01-4.54 3.7-8.24 8.25-8.24zM8.53 7.33c-.16 0-.43.06-.66.31-.22.25-.87.86-.87 2.07 0 1.22.89 2.39 1 2.56.14.17 1.76 2.67 4.25 3.73.59.27 1.05.42 1.41.53.59.19 1.13.16 1.56.1.48-.07 1.46-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.07-.1-.25-.16-.53-.3-.28-.14-1.46-.72-1.68-.8-.22-.08-.39-.12-.55.12-.17.25-.64.8-.78.96-.14.17-.28.19-.53.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.28.37-.42.13-.14.17-.25.25-.41.08-.17.04-.31-.02-.44-.06-.12-.55-1.31-.75-1.8-.2-.47-.4-.41-.55-.42z"/></svg>
                </div>
                <div class="link-text">WhatsApp Saya</div>
                <div class="link-arrow">›</div>
            </a>

            <a href="https://whatsapp.com/channel/0029VbAMuJiGk1FpAqHGAq3y" target="_blank" class="link-item">
                <div class="link-icon icon-channel">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h12v2H6zm0 4h8v2H6z"/></svg>
                </div>
                <div class="link-text">Saluran WhatsApp</div>
                <div class="link-arrow">›</div>
            </a>
        </div>
    </div>

    <!-- MODAL 1: PILIH PEMBAYARAN -->
    <div class="modal-overlay" id="paymentModal">
        <div class="modal-content">
            <div class="modal-title">Pilih Pembayaran</div>
            <div class="modal-options">
                <button onclick="openDanaModal()" class="modal-btn btn-dana">
                    <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                    DANA
                </button>

                <!-- ⬇️ GANTI "#" DENGAN LINK GAMBAR QRIS ANDA ⬇️ -->
                <a href="https://cdn.phototourl.com/member/2026-10-10-76af24b2-87d0-4d80-8eca-2444bc87aad0.jpg" target="_blank" class="modal-btn btn-qris">
                    <svg viewBox="0 0 24 24"><path d="M3 3h6v6H3V3zm2 2v2h2V5H5zm8-2h6v6h-6V3zm2 2v2h2V5h-2zM3 15h6v6H3v-6zm2 2v2h2v-2H5zm13-2h3v2h-3v-2zm-3 0h2v2h-2v-2zm-3 0h2v2h-2v-2zm3 3h3v2h-3v-2zm-3 0h2v2h-2v-2zm3 3h3v2h-3v-2z"/></svg>
                    Scan QRIS
                </a>
            </div>
            <button class="modal-close" onclick="closePaymentModal()">Batal</button>
        </div>
    </div>

    <!-- MODAL 2: DETAIL DANA -->
    <div class="modal-overlay" id="danaModal">
        <div class="modal-content">
            <div class="modal-title">Pembayaran DANA</div>
            
            <div class="dana-detail">
                <div class="dana-label">Nomor DANA</div>
                <!-- ⬇️ GANTI NOMOR DANA ANDA DI SINI ⬇️ -->
                <div class="dana-number" id="danaNumber">081353682082</div>
                <!-- ⬇️ GANTI NAMA PEMILIK DANA ⬇️ -->
                <div class="dana-name">A/N: KHOTIJAH</div>
            </div>

            <div class="modal-options">
                <button onclick="copyDana()" class="modal-btn btn-copy">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    Salin Nomor DANA
                </button>
            </div>
            <button class="modal-close" onclick="closeDanaModal()">Kembali</button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        Nomor DANA berhasil disalin!
    </div>

    <!-- ⬇️⬇️⬇️ JAVASCRIPT (BAGIAN INI YANG HILANG SEBELUMNYA) ⬇️⬇️⬇️ -->
    <script>
        // Buka Modal Pilih Pembayaran
        function openPaymentModal() {
            document.getElementById('paymentModal').style.display = 'flex';
        }

        // Tutup Modal Pilih Pembayaran
        function closePaymentModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }

        // Buka Modal Detail DANA
        function openDanaModal() {
            closePaymentModal();
            document.getElementById('danaModal').style.display = 'flex';
        }

        // Tutup Modal Detail DANA
        function closeDanaModal() {
            document.getElementById('danaModal').style.display = 'none';
        }

        // Tutup modal jika klik di luar area
        document.getElementById('paymentModal').addEventListener('click', function(e) {
            if (e.target === this) closePaymentModal();
        });
        document.getElementById('danaModal').addEventListener('click', function(e) {
            if (e.target === this) closeDanaModal();
        });

        // Copy Nomor DANA
        function copyDana() {
            const nomorDana = "081353682082"; // ⬅️ GANTI NOMOR DANA ANDA DI SINI JUGA
            navigator.clipboard.writeText(nomorDana).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "toast show";
                setTimeout(function(){ 
                    toast.className = toast.className.replace("show", ""); 
                }, 3000);
            }).catch(err => {
                alert("Gagal menyalin: " + err);
            });
        }
    </script>

</body>
</html>
